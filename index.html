<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <h1>Login</h1>
    <form>
      <div class="form-group">
        <label for="username">Nome:</label>
        <input type="email" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Login</button>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const supabaseUrl = 'https://ntsifucyoyyvsbugpjdl.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50c2lmdWN5b3l5dnNidWdwamRsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1MzE4MzQ1MywiZXhwIjoyMDY4NzU5NDUzfQ.hBufV5Lr9WU0NBXdUDdOGheR_xTYR8RNEgUqnMO9Lq4';
    const supabase = createClient(supabaseUrl, supabaseKey);

    document.querySelector('form').addEventListener('submit', async function (event) {
      event.preventDefault();
      
      const email = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert('Por favor, preencha todos os campos.');
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
          alert('Erro ao fazer login: ' + error.message);
        } else {
          alert('Login realizado com sucesso!');
          window.location.href = '/crud.html';
        }
      } catch (err) {
        console.error('Erro inesperado:', err);
        alert('Ocorreu um erro inesperado.');
      }
    });
  </script>
</body>
</html>
