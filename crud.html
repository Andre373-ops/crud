<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MENU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="menu-page">
  <div class="container">
    <h1 class="loading">Verificando autenticação...</h1>
  </div>
    
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        
    const supabaseUrl = 'https://ntsifucyoyyvsbugpjdl.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50c2lmdWN5b3l5dnNidWdwamRsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1MzE4MzQ1MywiZXhwIjoyMDY4NzU5NDUzfQ.hBufV5Lr9WU0NBXdUDdOGheR_xTYR8RNEgUqnMO9Lq4';
    const supabase = createClient(supabaseUrl, supabaseKey);
            
    const checkUser = async () => {
      try {
        const { data: { session }, error } = await supabase.auth.getSession();
                
        if (!session || error) {
          alert('Você precisa estar logado para acessar esta página.');
          window.location.href = '/';
        } else {
          document.body.innerHTML = `
            <div class="container">
              <h1>CRUD - Menu Principal</h1>
              <p>Bem-vindo, <strong>${session.user.email}</strong></p>
                            
              <div class="button-group">
                <button id="cadastro">Ir para Cadastro</button>
                <button id="logout">Voltar</button>
              </div>
            </div>
          `;
                    
          document.getElementById('cadastro').addEventListener('click', () => {
            window.location.href = 'cadastro.html';
          });
                    
          document.getElementById('logout').addEventListener('click', () => {
            window.location.href = '/';
          });
        }
      } catch (error) {
        console.error('Erro ao verificar autenticação:', error);
        alert('Erro ao verificar autenticação. Tente novamente.');
        window.location.href = '/';
      }
    };
        
    checkUser();
  </script>
</body>
</html>
